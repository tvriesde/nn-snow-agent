name: Evaluation contracts
on:
  push:
    paths:
      - 'evals/**'
      - 'src/backend/**'
      - 'src/core/**'
      - 'data/servicenow/**'
      - 'tests/evals/**'
      - '.github/workflows/evaluation-tests.yml'
  pull_request:
    paths:
      - 'evals/**'
      - 'src/backend/**'
      - 'src/core/**'
      - 'data/servicenow/**'
      - 'tests/evals/**'
      - '.github/workflows/evaluation-tests.yml'
permissions:
  contents: read
jobs:
  offline-evaluation-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared evaluation dependencies
        run: python -m pip install -e .\evals
      - name: Verify committed ground truth and Python contracts
        run: |
          dotnet build evals\runner\Helpdesk.Evaluation.Runner.csproj
          helpdesk-eval validate
          python -m unittest discover -s evals\tests -v
      - name: Verify runner and backend behavior
        run: |
          dotnet test tests\evals\Helpdesk.Evaluation.Tests.csproj
          dotnet test tests\backend\Helpdesk.Backend.Tests.csproj --filter "FullyQualifiedName~ModelSelectionAndUsageTests|FullyQualifiedName~ApiTests|FullyQualifiedName~PolicyTests"
