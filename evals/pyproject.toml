[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk-evaluations"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "azure-ai-evaluation==1.15.0",
  "azure-identity>=1.21.0,<2",
  "openai>=2.14.0,<3",
]

[project.scripts]
helpdesk-eval = "helpdesk_evals.cli:main"

[tool.setuptools.packages.find]
include = ["helpdesk_evals*"]
